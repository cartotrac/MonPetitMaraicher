{% extends "base.html" %}
{% block title %}Mon profil — MonPetitMaraicher{% endblock %}
{% block content %}
<h1>👤 Mon profil</h1>
<p class="muted">Ces informations servent aux producteurs pour vous
   identifier et vous contacter (e-mail, téléphone).</p>
<form method="post" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">💾 Enregistrer</button>
  <a class="btn btn-outline" href="{% url 'portal:my_orders' %}">Annuler</a>
</form>
{% endblock %}
